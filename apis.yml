name: Sonus
description: >-
  Sonus is the API Evangelist network profile for the company that began as Sonus Networks,
  an early pioneer of VoIP softswitches and session border controllers (SBCs), and which today
  operates as Ribbon Communications (NASDAQ: RBBN) following its 2017 merger with GENBAND.
  Ribbon builds real-time communications, IP optical networking, session border control, cloud
  and edge, and network security and analytics software for service providers and enterprises.
  This profile originated as a Matrix Partners portfolio lead. Ribbon publishes enterprise
  product, support, and responsible-disclosure resources but no public developer API or open
  API specification was found at the time of enrichment.
